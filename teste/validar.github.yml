name: Validar monitor
on: [push, pull_request]
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compilar e testar
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Testar MQTT, e-mail e push em Docker
        run: ./scripts/testar-integracao.sh
  arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Validar imagem ARM64
        run: docker build -t monitor-energia:arm64 .
