services:
  monitor:
    build: .
    image: monitor-energia:local
    restart: unless-stopped
    env_file: .env
    environment:
      DIRETORIO_DADOS: /dados
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - estado:/dados
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    stop_grace_period: 35s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  estado:
